services:
  sieve:
    build: .
    restart: unless-stopped
    ports:
      # The port is open only on this machine. Change the left side to reach it from other machines.
      - '127.0.0.1:3000:3000'
    environment:
      # Set a password before you open the port to other machines.
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
    volumes:
      - sieve-data:/data
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    extra_hosts:
      # Lets the container reach a model server on the host at http://host.docker.internal:11434
      # With podman, http://host.containers.internal:11434 also works without this entry.
      - 'host.docker.internal:host-gateway'

volumes:
  sieve-data:
